server {
    listen 80;
    server_name papermotion.chillicurry.uk;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-papermotion;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name papermotion.chillicurry.uk;
    ssl_certificate /etc/nginx/ssl/papermotion.chillicurry.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/papermotion.chillicurry.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Compatibility redirects for the temporary subpath deployment.
    location = /papermotion { return 302 /; }
    location ^~ /papermotion/ { rewrite ^/papermotion/(.*)$ /$1 redirect; }
    include /etc/nginx/snippets/papermotion-app.conf;
}
