map "$server_port:$request_method:$http_origin" $papermotion_bad_origin {
    default 1;
    ~^[0-9]+:(GET|HEAD|OPTIONS): 0;
    ~^(443|3011):(POST|PUT|PATCH|DELETE):https://papermotion[.]chillicurry[.]uk$ 0;
    ~^443:(POST|PUT|PATCH|DELETE):https://(www[.])?chillicurry[.]uk$ 0;
    # The preview listener is bound to loopback; this exception never applies on public 443.
    ~^3011:(POST|PUT|PATCH|DELETE):http://127[.]0[.]0[.]1:3011$ 0;
}
map "$request_method:$http_sec_fetch_site" $papermotion_cross_site_write {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):cross-site$ 1;
}
